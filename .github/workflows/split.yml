name: Split packages

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    if: github.repository == 'tacticmedia/scim'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { prefix: scim-server, repository: tacticmedia/scim-server }
          - { prefix: scim-server-bundle, repository: tacticmedia/scim-server-bundle }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches the version line
        if: github.ref_type == 'tag'
        run: |
          line="$(printf '%s' "$GITHUB_REF_NAME" | cut -d. -f1-2)"
          jq -e --arg dev "$line.x-dev" '[.repositories[].options.versions[]] | all(. == $dev)' composer.json > /dev/null \
            || { echo "::error::The root path repositories must declare $line.x-dev for the tag $GITHUB_REF_NAME."; exit 1; }
          jq -e --arg constraint "^$line" '.require["tacticmedia/scim-server"] == $constraint' scim-server-bundle/composer.json > /dev/null \
            || { echo "::error::scim-server-bundle must require tacticmedia/scim-server ^$line for the tag $GITHUB_REF_NAME."; exit 1; }

      - name: Split and push
        env:
          PREFIX: ${{ matrix.package.prefix }}
          TARGET: https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/${{ matrix.package.repository }}.git
        run: |
          split_sha="$(git subtree split --prefix="$PREFIX" HEAD)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git push "$TARGET" "$split_sha:refs/tags/$GITHUB_REF_NAME"
          else
            git push "$TARGET" "$split_sha:refs/heads/$GITHUB_REF_NAME"
          fi
