---
# The runner `make ci` drives ({@see docs/ci.md}). The workspace sits at the path GitHub uses.
# run.sh sets ACT_PROJECT.
name: ${ACT_PROJECT:?}-act

services:
  runner:
    build: .
    image: ${ACT_PROJECT:?}-act-runner
    privileged: true
    working_dir: /home/runner/work/${ACT_PROJECT:?}/${ACT_PROJECT:?}
    volumes:
      - docker:/var/lib/docker
      - act:/root/.cache
      - workspace:/home/runner/work/${ACT_PROJECT:?}/${ACT_PROJECT:?}
    # After an unclean stop, the containerd pid file in /run can name a live process, and dockerd does not start.
    tmpfs:
      - /run
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      start_period: 60s

volumes:
  docker:
  act:
  workspace:
